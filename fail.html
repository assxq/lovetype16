<!DOCTYPE html>

<head>

<body>

  const q=new URLSearchParams(location.search);
  const m=q.get('message');
  document.getElementById('msg').textContent = m ? m : '결제를 취소했거나 문제가 생겼어요. 요금은 청구되지 않았어요.';
