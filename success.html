<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결제 확인 중 — Love Type 16</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="pay.css">
</head>
<body>
<div class="wrap">
  <header class="top"><a href="index.html">LOVE TYPE 16</a></header>
  <div class="card center" id="box">
    <div class="spin"></div>
    <h1 style="font-size:1.2rem">결제를 확인하고 있어요</h1>
    <p class="muted">창을 닫지 말고 잠시만 기다려 주세요.</p>
  </div>
</div>
<script>
(async()=>{
  const q=new URLSearchParams(location.search);
  const body={paymentKey:q.get('paymentKey'),orderId:q.get('orderId'),amount:q.get('amount')};
  const box=document.getElementById('box');
  const fail=(m)=>{ box.innerHTML=`<h1 style="font-size:1.2rem">결제 확인에 실패했어요</h1><p class="muted" style="margin:.6rem 0 1rem">${m}</p><p class="muted">결제가 완료된 것으로 보이는데 열람이 안 된다면 <a href="mailto:assxq@naver.com">assxq@naver.com</a>으로 주문번호(${body.orderId||'-'})와 함께 문의해 주세요.</p><a class="btn ghost" href="compatibility.html">궁합 페이지로</a>`; };
  if(!body.paymentKey||!body.orderId||!body.amount) return fail('잘못된 접근이에요.');
  try{
    const r=await fetch('/api/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok) return fail(d.error||'승인되지 않았어요.');
    try{ const m=JSON.parse(localStorage.getItem('lt16_tokens')||'{}'); m[[d.a,d.b].sort().join('_')]=d.token; localStorage.setItem('lt16_tokens',JSON.stringify(m)); }catch{}
    location.replace('report.html#t='+encodeURIComponent(d.token));
  }catch{ fail('네트워크 문제가 생겼어요. 이 페이지를 새로고침하면 다시 확인할 수 있어요.'); }
})();
</script>
</body>
</html>
