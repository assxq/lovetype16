<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>커플 궁합 리포트 결제 — Love Type 16</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="pay.css">
<script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body>
<div class="wrap">
  <header class="top"><a href="index.html">LOVE TYPE 16</a></header>

  <div id="loading" class="card center"><div class="spin"></div><div class="muted">불러오는 중…</div></div>
  <div id="unavailable" class="card center" style="display:none">
    <h1>준비 중인 조합이에요</h1>
    <p class="muted">선택한 조합의 리포트를 찾을 수 없어요.</p>
    <a class="btn" style="margin-top:1rem" href="compatibility.html">궁합 다시 선택하기</a>
  </div>

  <main id="main" style="display:none">
    <div class="card">
      <span class="badge">COUPLE REPORT</span>
      <h1 id="title"></h1>
      <div class="score"><span class="n" id="score"></span><span><b id="label"></b><br><span class="muted" id="summary"></span></span></div>
    </div>

    <div class="card">
      <h2>리포트에 담긴 내용</h2>
      <ul class="lock-list" id="lockList"></ul>
      <div class="price"><span class="muted">커플 궁합 리포트 (1개 조합)</span><b id="price"></b></div>
    </div>

    <div class="card">
      <div id="payment-method"></div>
      <div id="agreement"></div>
      <label class="consent">
        <input type="checkbox" id="consent">
        <span>디지털 콘텐츠는 결제 즉시 열람이 시작되어, <b>열람 개시 후에는 청약철회가 제한</b>된다는 안내를 확인했고 이에 동의합니다. (콘텐츠에 오류가 있거나 열람이 불가능한 경우에는 환불됩니다.)</span>
      </label>
      <button class="btn" id="payBtn" disabled>결제하기</button>
      <div class="err" id="err"></div>
    </div>
    <p class="muted center" style="margin-top:1rem">재미로 보는 연애 유형 분석이며, 심리 검사나 전문 상담이 아닙니다.</p>
  </main>

  <footer class="biz">
    상호: 삼월랩스 · 대표: 김민수 · 사업자등록번호: 141-90-67002<br>
    고객센터: <a href="mailto:assxq@naver.com">assxq@naver.com</a> ·
    <a href="terms.html">이용약관</a> · <a href="privacy.html">개인정보처리방침</a>
  </footer>
</div>

<script>
const NAMES={ECRF:'열정 로맨티시스트',ECRA:'츤데레 로맨티스트',ECLF:'직진 현실주의자',ECLA:'표현형 신중파',ESRF:'자유로운 로맨티스트',ESRA:'시크한 로맨티스트',ESLF:'쿨한 직진러',ESLA:'어른 연애러',HCRF:'소심한 껌딱지',HCRA:'속앓이 로맨티스트',HCLF:'조용한 진심파',HCLA:'무뚝뚝한 로열티',HSRF:'신비주의 로맨티스트',HSRA:'고독한 몽상가',HSLF:'침착한 관찰자',HSLA:'신중한 거리유지러'};
const $=id=>document.getElementById(id);
const won=n=>n.toLocaleString('ko-KR')+'원';
const q=new URLSearchParams(location.search);
const A=(q.get('a')||'').toUpperCase(), B=(q.get('b')||'').toUpperCase();

function showUnavailable(){ $('loading').style.display='none'; $('unavailable').style.display='block'; }

async function init(){
  if(!NAMES[A]||!NAMES[B]) return showUnavailable();
  let pv;
  try{
    const r=await fetch(`/api/preview?a=${A}&b=${B}`); if(!r.ok) return showUnavailable(); pv=await r.json();
  }catch{ return showUnavailable(); }
  if(!pv.available) return showUnavailable();

  $('title').textContent=`${NAMES[A]} × ${NAMES[B]}`;
  $('score').textContent=pv.score+'점';
  $('label').textContent=pv.label||'';
  $('summary').textContent=pv.summary;
  $('price').textContent=won(pv.price);
  $('lockList').innerHTML=pv.sectionTitles.map(t=>`<li>🔒 ${t}</li>`).join('');
  $('loading').style.display='none'; $('main').style.display='block';

  // 주문 생성(금액·주문번호는 서버가 결정)
  let order;
  try{
    const r=await fetch('/api/create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product:'pair',a:A,b:B})});
    order=await r.json(); if(!r.ok) throw new Error(order.error);
  }catch(e){ $('err').textContent='주문을 만들지 못했어요. 잠시 후 다시 시도해 주세요.'; return; }
  if(!order.clientKey){ $('err').textContent='결제 설정이 아직 완료되지 않았어요.'; return; }

  const toss=TossPayments(order.clientKey);
  const widgets=toss.widgets({customerKey:TossPayments.ANONYMOUS});
  await widgets.setAmount({currency:'KRW',value:order.amount});
  await Promise.all([
    widgets.renderPaymentMethods({selector:'#payment-method',variantKey:'DEFAULT'}),
    widgets.renderAgreement({selector:'#agreement',variantKey:'AGREEMENT'})
  ]);

  const btn=$('payBtn'), consent=$('consent');
  consent.addEventListener('change',()=>{ btn.disabled=!consent.checked; });
  btn.addEventListener('click',async()=>{
    $('err').textContent='';
    if(!consent.checked) return;
    btn.disabled=true;
    try{
      await widgets.requestPayment({
        orderId:order.orderId,
        orderName:order.orderName,
        successUrl:location.origin+'/success.html',
        failUrl:location.origin+'/fail.html'
      });
    }catch(e){
      if(e && e.code!=='USER_CANCEL') $('err').textContent=e.message||'결제 중 문제가 생겼어요.';
      btn.disabled=false;
    }
  });
}
init();
</script>
</body>
</html>
