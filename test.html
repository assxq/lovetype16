<style>
  :root {
    --cream: #f4f2ee;
    --cream-soft: #fbfaf8;
    --cream-deep: #e6e3dd;
    --wine: #141210;
    --wine-deep: #0a0908;
    --wine-soft: #57534d;
    --gold: #b8352a;
    --gold-soft: #cfc9c0;
    --ink: #1a1816;
    --ink-soft: #5f5a54;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--cream);
    color: var(--ink);
    line-height: 1.6;
    overflow-x: hidden;
    font-weight: 400;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
    pointer-events: none;
    opacity: 0.05;
    z-index: 100;
    mix-blend-mode: multiply;
  }

  /* ===== 상단 헤더 (프로그레스) ===== */
  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 50;
    padding: 1.2rem 1.5rem 1rem;
    background: rgba(244, 242, 238, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(20, 18, 16, 0.06);
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.9rem;
  }

  .back-btn {
    background: none;
    border: none;
    color: var(--wine);
    font-size: 1.3rem;
    cursor: pointer;
    padding: 0.3rem;
    line-height: 1;
    transition: opacity 0.3s;
  }

  .back-btn:hover {
    opacity: 0.6;
  }

  .progress-text {
    font-size: 0.78rem;
    color: var(--ink-soft);
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .progress-text .current {
    color: var(--wine);
    font-weight: 700;
    font-size: 0.9rem;
  }

  .progress-text .slash {
    color: var(--ink-soft);
    margin: 0 0.2rem;
    opacity: 0.5;
  }

  .header-spacer {
    width: 24px;
  }

  /* 프로그레스 바 */
  .progress-bar {
    width: 100%;
    height: 3px;
    background: rgba(20, 18, 16, 0.1);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--wine), var(--gold));
    border-radius: 2px;
    transition: width 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    width: 0%;
  }

  /* ===== 메인 영역 ===== */
  main {
    padding: 7rem 1.5rem 3rem;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 600px;
    margin: 0 auto;
    width: 100%;
  }

  .question-container {
    opacity: 1;
    transform: translateX(0);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .question-container.exit-left {
    opacity: 0;
    transform: translateX(-30px);
  }

  .question-container.exit-right {
    opacity: 0;
    transform: translateX(30px);
  }

  .question-container.enter {
    opacity: 0;
    transform: translateX(30px);
  }

  /* 질문 번호 표시 */
  .q-num {
    font-size: 0.72rem;
    color: var(--gold);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.7rem;
  }

  .q-num::before {
    content: '';
    width: 24px;
    height: 1px;
    background: var(--gold);
  }

  /* 질문 텍스트 */
  .question {
    font-size: clamp(1.3rem, 5vw, 1.65rem);
    line-height: 1.5;
    color: var(--wine);
    font-weight: 700;
    margin-bottom: 2.5rem;
    letter-spacing: -0.025em;
  }

  /* 답변 옵션 */
  .options {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }

  .option {
    background: var(--cream-soft);
    border: 1.5px solid rgba(20, 18, 16, 0.12);
    border-radius: 6px;
    padding: 1.3rem 1.4rem;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    text-align: left;
    font-family: 'Pretendard', sans-serif;
    font-size: 0.98rem;
    line-height: 1.55;
    color: var(--ink);
    font-weight: 500;
    position: relative;
    width: 100%;
    letter-spacing: -0.015em;
  }

  .option:hover {
    border-color: var(--wine-soft);
    background: var(--cream);
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(20, 18, 16, 0.08);
  }

  .option-marker {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid var(--wine-soft);
    color: var(--wine-soft);
    font-size: 0.7rem;
    font-weight: 700;
    margin-right: 0.85rem;
    flex-shrink: 0;
    transition: all 0.3s;
    vertical-align: middle;
    margin-top: -2px;
  }

  .option:hover .option-marker {
    background: var(--wine);
    color: var(--cream);
    border-color: var(--wine);
  }

  /* 터치 기기(모바일)에서는 hover 잔상 방지 — hover 효과 무효화 */
  @media (hover: none) {
    .option:hover {
      border-color: rgba(20, 18, 16, 0.12);
      background: var(--cream-soft);
      transform: none;
      box-shadow: none;
    }
    .option:hover .option-marker {
      background: transparent;
      color: var(--wine-soft);
      border-color: var(--wine-soft);
    }
    .back-btn:hover { background: transparent; color: var(--wine); }
  }

  /* 선택된 상태 (애니메이션 중) */
  .option.selected {
    background: var(--wine);
    border-color: var(--wine);
    color: var(--cream);
    transform: scale(1.02);
    box-shadow: 0 12px 30px rgba(20, 18, 16, 0.25);
  }

  .option.selected .option-marker {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--wine-deep);
  }

  /* 뒤로 갔을 때 이전 선택 표시 (selected보다 은은하지만 또렷하게) */
  .option.preselected,
  .option.preselected:hover {
    border-color: var(--gold) !important;
    background: #f6ecea !important;
    box-shadow: 0 2px 12px rgba(20, 18, 16, 0.2) !important;
  }

  .option.preselected .option-marker,
  .option.preselected:hover .option-marker {
    background: var(--gold) !important;
    border-color: var(--gold) !important;
    color: #fff !important;
  }

  /* ===== 격려 메시지 ===== */
  .encouragement {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--wine);
    color: var(--cream);
    padding: 0.7rem 1.4rem;
    border-radius: 2px;
    font-size: 0.85rem;
    font-weight: 500;
    box-shadow: 0 12px 30px rgba(20, 18, 16, 0.3);
    opacity: 0;
    pointer-events: none;
    transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 60;
  }

  .encouragement.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-10px);
  }

  /* ===== 로딩 화면 (분석 중) ===== */
  .loading {
    position: fixed;
    inset: 0;
    background: var(--cream);
    z-index: 200;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 2rem;
  }

  .loading.show {
    display: flex;
  }

  .loading-emoji {
    font-size: 3rem;
    margin-bottom: 2rem;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50% { transform: scale(1.15); opacity: 1; }
  }

  .loading-title {
    font-size: 1.4rem;
    color: var(--wine);
    font-weight: 700;
    margin-bottom: 0.7rem;
    letter-spacing: -0.02em;
  }

  .loading-text {
    font-size: 0.9rem;
    color: var(--ink-soft);
    margin-bottom: 2.5rem;
    font-weight: 400;
    line-height: 1.6;
  }

  .loading-dots {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
  }

  .loading-dots span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--gold);
    animation: dot 1.4s ease-in-out infinite;
  }

  .loading-dots span:nth-child(1) { animation-delay: 0s; }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dot {
    0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; }
    40% { transform: scale(1.2); opacity: 1; }
  }

  /* ===== 데스크톱 ===== */
  @media (min-width: 768px) {
    header {
      padding: 1.5rem 3rem 1.2rem;
    }

    main {
      padding: 9rem 3rem 4rem;
    }

    .question {
      font-size: 1.7rem;
      margin-bottom: 3rem;
    }

    .option {
      padding: 1.5rem 1.6rem;
      font-size: 1rem;
    }
  }
  /* ===== 4단계 응답: 문장 카드 사이의 '조금 더' 버튼 ===== */
  .option { display: flex; align-items: center; }
  .option-text { flex: 1; }
  .lean-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
  }
  .lean {
    background: transparent;
    border: 1px dashed rgba(20, 18, 16, 0.28);
    border-radius: 2px;
    padding: 0.75rem 0.5rem;
    font-family: 'Pretendard', sans-serif;
    font-size: 0.84rem;
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }
  .lean:hover { border-color: var(--wine); color: var(--wine); }
  .lean.selected, .lean.preselected {
    background: var(--wine);
    border-style: solid;
    border-color: var(--wine);
    color: var(--cream);
  }
  @media (hover: none) { .lean:hover { border-color: rgba(20, 18, 16, 0.28); color: var(--ink-soft); } }
  .scale-hint {
    margin-top: 1.2rem;
    font-size: 0.8rem;
    color: var(--ink-soft);
    text-align: center;
    line-height: 1.6;
  }

  .invite-banner {
    max-width: 540px;
    margin: 0 auto 1rem;
    padding: 0.8rem 1rem;
    border-radius: 6px;
    background: rgba(184, 53, 42, 0.12);
    border: 1px solid rgba(184, 53, 42, 0.35);
    color: var(--wine, #141210);
    font-size: 0.88rem;
    line-height: 1.5;
    text-align: center;
  }
</style>

<script>
  // ===== 24문항 데이터 (v2) =====
  // 각 문항은 두 문장 중 어느 쪽에 더 가까운지 4단계로 답한다.
  //   a / b: 위·아래 문장, pa / pb: 각 문장이 가리키는 성향 글자
  //   위 문장 그대로 = pa +2, 위쪽에 조금 = pa +1, 아래쪽에 조금 = pb +1, 아래 문장 그대로 = pb +2
  // 축: 1 표현(E 직진러 / H 은은파) · 2 거리감(C 껌딱지 / S 독립파)
  //     3 사고방식(R 감성파 / L 현실파) · 4 갈등대처(F 정면돌파 / A 숨고르기)
  // 축마다 6문항, 위·아래 순서를 섞어 한쪽 위치에 답이 몰리지 않게 했다.
  // anchor: 동점일 때 그 축의 방향을 정하는 대표 문항.
  const QUESTIONS = [
    { axis: 1, anchor: true, q: '좋아하는 사람이 생기면 나는…',
      a: '티를 내고 먼저 다가가는 편이다', pa: 'E',
      b: '마음이 확실해질 때까지 조용히 지켜보는 편이다', pb: 'H' },
    { axis: 3, anchor: true, q: '누군가에게 처음 끌리는 순간은…',
      a: '말로 설명하기 어려운 분위기와 설렘을 느낄 때', pa: 'R',
      b: '대화하다가 생각과 생활 방식이 잘 맞는다고 느낄 때', pb: 'L' },
    { axis: 4, anchor: true, q: '연인과 다툰 직후 나는…',
      a: '바로 이야기해서 그 자리에서 풀고 싶다', pa: 'F',
      b: '일단 혼자 감정을 가라앉힐 시간이 필요하다', pb: 'A' },
    { axis: 2, anchor: true, q: '바쁜 한 주를 보내고 맞은 주말, 나는…',
      a: '연인과 함께 쉬어야 가장 충전된다', pa: 'C',
      b: '혼자만의 시간을 먼저 갖고 싶다', pb: 'S' },
    { axis: 1, q: '연인과의 일상을 SNS에…',
      a: '우리 둘만 알면 충분하다고 느낀다', pa: 'H',
      b: '자연스럽게 자주 올리는 편이다', pb: 'E' },
    { axis: 3, q: '연인을 고를 때 더 중요한 것은…',
      a: '함께 있을 때의 설렘', pa: 'R',
      b: '가치관과 미래에 대한 생각이 맞는지', pb: 'L' },
    { axis: 2, q: '이상적인 휴일은…',
      a: '각자 시간을 보내다 저녁에 만나는 것', pa: 'S',
      b: '아침부터 연인과 같이 보내는 것', pb: 'C' },
    { axis: 4, q: '서운한 일이 생겼을 때 나는…',
      a: '시간이 지나 괜찮아지면 굳이 꺼내지 않는 편이다', pa: 'A',
      b: '그날 안에 말하고 넘어가는 편이다', pb: 'F' },
    { axis: 1, q: '"보고 싶어" 같은 마음을…',
      a: '생각날 때 바로 말로 전한다', pa: 'E',
      b: '말보다 만나러 가거나 챙기는 걸로 보여준다', pb: 'H' },
    { axis: 3, q: '"사랑"이라는 말을 들으면 먼저 떠오르는 것은…',
      a: '신뢰, 그리고 함께 만들어 가는 일상', pa: 'L',
      b: '두근거림, 그리고 운명 같은 감정', pb: 'R' },
    { axis: 4, q: '다툼이 길어질 때 나는…',
      a: '대화를 잠시 멈추고 거리를 두는 편이다', pa: 'A',
      b: '결론이 날 때까지 대화를 이어가는 편이다', pb: 'F' },
    { axis: 2, q: '연인과 만나는 빈도는…',
      a: '일주일에 한두 번이면 충분하다', pa: 'S',
      b: '가능하면 자주, 거의 매일 보고 싶다', pb: 'C' },
    { axis: 1, q: '연인에게 고마운 일이 생기면…',
      a: '다음에 조용히 갚아 주는 식으로 표현한다', pa: 'H',
      b: '말로 분명하게 고맙다고 표현한다', pb: 'E' },
    { axis: 4, q: '연인이 나에게 서운하다고 말할 때…',
      a: '지금 바로 무엇이 문제였는지 이야기하자고 한다', pa: 'F',
      b: '생각을 정리할 시간을 조금 달라고 한다', pb: 'A' },
    { axis: 3, q: '연인의 어떤 모습에 더 끌리나요?',
      a: '약속을 지키는 책임감 있는 태도', pa: 'L',
      b: '나만 알아채는 작은 다정함과 분위기', pb: 'R' },
    { axis: 2, q: '연인이 친구들과 약속이 있는 날…',
      a: '같이 있지 못해 조금 아쉽다', pa: 'C',
      b: '나도 내 시간을 보낼 수 있어 좋다', pb: 'S' },
    { axis: 1, q: '좋아하는 사람 앞에서 내 감정은…',
      a: '잘 드러나지 않는 편이다', pa: 'H',
      b: '표정과 말투에 그대로 드러난다', pb: 'E' },
    { axis: 4, q: '화해할 때 더 자연스러운 방식은…',
      a: '며칠 지나 차분해진 뒤 다시 이야기하는 것', pa: 'A',
      b: '그날 안에 만나서 풀고 함께 시간을 보내는 것', pb: 'F' },
    { axis: 3, q: '연인과의 미래 이야기는…',
      a: '관계가 깊어지면 자연스럽게 나오는 것', pa: 'R',
      b: '어느 정도 만나면 한 번은 짚고 넘어가야 하는 것', pb: 'L' },
    { axis: 2, q: '"각자 시간이 필요해"라는 말이…',
      a: '자연스럽고 편하게 들린다', pa: 'S',
      b: '이해는 되지만 조금 멀게 느껴진다', pb: 'C' },
    { axis: 1, q: '기념일이 다가오면…',
      a: '내가 먼저 이야기를 꺼내고 크게 챙긴다', pa: 'E',
      b: '티 내지 않고 조용히 준비한다', pb: 'H' },
    { axis: 4, q: '풀리지 않은 갈등이 남아 있을 때…',
      a: '내가 먼저 연락해서 매듭을 지으려 한다', pa: 'F',
      b: '서로 마음이 가라앉을 때까지 기다린다', pb: 'A' },
    { axis: 3, q: '연애 초반에 더 신경 쓰이는 것은…',
      a: '생활 패턴과 생각이 잘 맞는지', pa: 'L',
      b: '둘 사이의 감정과 케미', pb: 'R' },
    { axis: 2, q: '연인과 같은 공간에 있을 때…',
      a: '이야기하거나 붙어 있고 싶다', pa: 'C',
      b: '각자 할 일을 하면서 같이 있는 게 좋다', pb: 'S' }
  ];

  // ===== 추가 문항 (애매한 축에만 출제) =====
  // 기본 24문항을 마친 뒤 이긴 쪽 비율이 EXTRA_THRESHOLD 미만인 축에 한해 그 축의 3문항을 더 묻는다.
  const EXTRA_THRESHOLD = 0.6;
  const EXTRA_QUESTIONS = {
    1: [
      { axis: 1, extra: true, q: '연인이 새 옷을 입고 나왔을 때…',
        a: '바로 "잘 어울린다"고 말한다', pa: 'E',
        b: '말은 못 해도 자꾸 눈이 간다', pb: 'H' },
      { axis: 1, extra: true, q: '연인에게 내 하루 이야기를…',
        a: '물어보면 그때 이야기하는 편이다', pa: 'H',
        b: '묻지 않아도 먼저 이것저것 이야기한다', pb: 'E' },
      { axis: 1, extra: true, q: '"사랑해"라는 말은…',
        a: '아껴 두었다가 중요한 순간에 한다', pa: 'H',
        b: '마음이 들 때마다 한다', pb: 'E' }
    ],
    2: [
      { axis: 2, extra: true, q: '여행을 간다면…',
        a: '연인과 둘이 가는 여행이 가장 좋다', pa: 'C',
        b: '혼자 또는 친구와 가는 여행도 꼭 필요하다', pb: 'S' },
      { axis: 2, extra: true, q: '연인과의 연락은…',
        a: '할 말이 있을 때 하면 된다', pa: 'S',
        b: '별일 없어도 자주 주고받고 싶다', pb: 'C' },
      { axis: 2, extra: true, q: '함께 사는 모습을 상상하면…',
        a: '각자의 방이나 공간이 꼭 있었으면 한다', pa: 'S',
        b: '늘 같은 공간에서 지내는 게 좋다', pb: 'C' }
    ],
    3: [
      { axis: 3, extra: true, q: '기념일 선물로 더 마음이 가는 것은…',
        a: '손편지처럼 마음이 담긴 것', pa: 'R',
        b: '평소 필요하다고 말했던 실용적인 것', pb: 'L' },
      { axis: 3, extra: true, q: '연애에서 "운명"이라는 말은…',
        a: '낭만적인 표현일 뿐, 결국 노력이 중요하다', pa: 'L',
        b: '어느 정도는 정말 있다고 믿는다', pb: 'R' },
      { axis: 3, extra: true, q: '연인과의 돈 이야기는…',
        a: '관계가 진지해지면 미리 맞춰 두는 게 좋다', pa: 'L',
        b: '굳이 먼저 꺼내기보다 자연스럽게 맞춰 간다', pb: 'R' }
    ],
    4: [
      { axis: 4, extra: true, q: '연인의 말에 마음이 상했을 때…',
        a: '그 자리에서 "방금 그 말 서운했어"라고 말한다', pa: 'F',
        b: '일단 넘기고 마음이 정리되면 이야기한다', pb: 'A' },
      { axis: 4, extra: true, q: '다툰 날 밤에는…',
        a: '각자 쉬고 내일 이야기하는 게 낫다', pa: 'A',
        b: '잠들기 전에 꼭 풀고 싶다', pb: 'F' },
      { axis: 4, extra: true, q: '연인과 의견이 다를 때…',
        a: '각자 생각할 시간을 갖고 다음에 다시 이야기한다', pa: 'A',
        b: '바로 이야기해서 서로의 생각을 맞춘다', pb: 'F' }
    ]
  };

  // 실제 출제 순서. 처음엔 기본 24문항, 애매한 축이 있으면 뒤에 추가 문항이 붙는다.
  let flow = QUESTIONS.slice();
  let extraAxes = null;   // 추가 문항을 붙인 축 목록 (한 번만 결정)

  // 답변 선택지: 문장 그대로(2점) / 조금 더 가까움(1점)
  const CHOICES = {
    A2: { side: 'a', w: 2 }, A1: { side: 'a', w: 1 },
    B1: { side: 'b', w: 1 }, B2: { side: 'b', w: 2 }
  };

  // 격려 메시지 (특정 진행 시점에 노출)
  const ENCOURAGEMENTS = {
    6: '잘하고 있어요 ✨',
    12: '절반 왔어요 🎉',
    18: '거의 다 왔어요 💕',
    23: '조금만 더 힘내요!'
  };

  // 로딩 화면 랜덤 문구
  const LOADING_MESSAGES = [
    '당신의 연애 패턴을 정리하고 있어요...',
    '가장 가까운 유형을 찾고 있어요...',
    '궁합에 중요한 성향을 분석하고 있어요...',
    '4가지 축의 균형을 맞추고 있어요...'
  ];

  // ===== 상태 관리 =====
  let currentIndex = 0;
  let answers = []; // { qIndex, choice: 'A2'|'A1'|'B1'|'B2', pole: 'E'|'H'|..., w: 1|2 }

  // ===== 렌더링 =====
  function renderQuestion(direction = 'normal') {
    const container = document.getElementById('questionContainer');
    const q = flow[currentIndex];

    // 페이드 아웃 후 변경
    if (direction !== 'normal') {
      container.classList.add(direction === 'next' ? 'exit-left' : 'exit-right');
    }

    setTimeout(() => {
      const saved = answers[currentIndex]?.choice;
      const pre = c => (saved === c ? 'preselected' : '');
      container.innerHTML = `
        <div class="q-num">${q.extra ? 'Bonus' : 'Question'} ${String(currentIndex + 1).padStart(2, '0')}</div>
        <h1 class="question">${q.q}</h1>
        <div class="options" role="group" aria-label="두 문장 중 나에게 더 가까운 쪽을 고르세요">
          <button type="button" class="option ${pre('A2')}" data-c="A2" onclick="selectAnswer('A2')">
            <span class="option-marker">A</span>
            <span class="option-text">${q.a}</span>
          </button>
          <div class="lean-row">
            <button type="button" class="lean ${pre('A1')}" data-c="A1" onclick="selectAnswer('A1')">A 쪽에 조금 더</button>
            <button type="button" class="lean ${pre('B1')}" data-c="B1" onclick="selectAnswer('B1')">B 쪽에 조금 더</button>
          </div>
          <button type="button" class="option ${pre('B2')}" data-c="B2" onclick="selectAnswer('B2')">
            <span class="option-marker">B</span>
            <span class="option-text">${q.b}</span>
          </button>
        </div>
        ${currentIndex === 0 ? '<p class="scale-hint">딱 맞는 문장이 있으면 문장을, 애매하면 가운데 버튼을 눌러 주세요.</p>' : ''}
      `;

      // 페이드 인
      container.classList.remove('exit-left', 'exit-right');
      if (direction !== 'normal') {
        container.classList.add('enter');
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            container.classList.remove('enter');
          });
        });
      }

      updateProgress();
      isAnimating = false;
    }, direction !== 'normal' ? 250 : 0);
  }

  function updateProgress() {
    document.getElementById('currentQ').textContent = currentIndex + 1;
    document.getElementById('totalQ').textContent = flow.length;
    const pct = ((currentIndex + 1) / flow.length) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
  }

  // ===== GA 이벤트 (gtag 미로드/차단 시에도 안전) =====
  const firedMilestones = new Set();
  function track(name, params) {
    try { if (window.gtag) gtag('event', name, params || {}); } catch (e) {}
  }

  // ===== 답변 선택 =====
  let isAnimating = false;
  function selectAnswer(choice) {
    const q = flow[currentIndex];
    // 전환 애니메이션 중 키보드 연타로 다음 문항이 건너뛰어지는 것 방지
    if (isAnimating) return;
    const c = CHOICES[choice];
    if (!c) return;
    isAnimating = true;
    const pole = c.side === 'a' ? q.pa : q.pb;

    // 시각적 선택 효과
    const buttons = document.querySelectorAll('.option, .lean');
    buttons.forEach(o => o.style.pointerEvents = 'none');
    const picked = document.querySelector(`[data-c="${choice}"]`);
    if (picked) picked.classList.add('selected');

    // 답변 저장 (이전 답변이 있으면 덮어쓰기)
    answers[currentIndex] = { qIndex: currentIndex, choice, pole, w: c.w, axis: q.axis };

    // 격려 메시지 표시 (해당 질문 번호일 때)
    const qNum = currentIndex + 1;
    if (ENCOURAGEMENTS[qNum]) {
      showEncouragement(ENCOURAGEMENTS[qNum]);
    }

    // 진행도 이벤트 (5문항 단위, 되돌아가도 한 번만)
    if (qNum % 5 === 0 && qNum < QUESTIONS.length && !q.extra && !firedMilestones.has(qNum)) {
      firedMilestones.add(qNum);
      track('test_progress', { question: qNum });
    }

    // 다음 문항 또는 결과
    setTimeout(() => {
      // 기본 문항을 다 풀었으면 애매한 축에 추가 문항을 붙인다 (한 번만)
      if (currentIndex === QUESTIONS.length - 1 && extraAxes === null) {
        extraAxes = ambiguousAxes();
        if (extraAxes.length) {
          extraAxes.forEach(ax => { flow = flow.concat(EXTRA_QUESTIONS[ax]); });
          const n = flow.length - QUESTIONS.length;
          showEncouragement(`결과를 더 정확하게 하려고 ${n}문항만 더 물어볼게요`, 3200);
          track('test_extra', { axes: extraAxes.join(''), count: n });
        }
      }
      if (currentIndex < flow.length - 1) {
        currentIndex++;
        renderQuestion('next');
      } else {
        // 마지막 문항: 프로그레스 100% 채우고 결과 계산
        document.getElementById('progressFill').style.width = '100%';
        finishTest();
      }
    }, 550);
  }

  // ===== 격려 메시지 표시 =====
  function showEncouragement(text, ms) {
    const el = document.getElementById('encouragement');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(showEncouragement.timer);
    showEncouragement.timer = setTimeout(() => {
      el.classList.remove('show');
    }, ms || 2000);
  }

  // ===== 뒤로 가기 =====
  function goBack() {
    if (isAnimating) return;
    if (currentIndex === 0) {
      if (confirm('테스트를 그만두시겠어요? 진행 상황이 사라져요.')) {
        window.location.href = 'index.html';
      }
    } else {
      currentIndex--;
      renderQuestion('prev');
    }
  }

  // ===== 결과 산출 =====
  const AXES = [['E', 'H'], ['C', 'S'], ['R', 'L'], ['F', 'A']];

  function calculateResult() {
    const scores = { E: 0, H: 0, C: 0, S: 0, R: 0, L: 0, F: 0, A: 0 };
    answers.forEach(ans => { if (ans) scores[ans.pole] += ans.w; });

    // 동점이면 앞 글자로 정하지 않고, 그 축의 대표 문항(anchor)에서 고른 쪽을 따른다
    const anchorPole = axis => {
      const i = flow.findIndex(q => q.axis === axis && q.anchor);
      return answers[i] ? answers[i].pole : AXES[axis - 1][0];
    };

    let type = '';
    const ties = {}, strengths = {};
    AXES.forEach(([x, y], i) => {
      const tie = scores[x] === scores[y];
      ties['axis' + (i + 1)] = tie;
      type += tie ? anchorPole(i + 1) : (scores[x] > scores[y] ? x : y);
      const sum = scores[x] + scores[y];
      strengths['axis' + (i + 1)] = sum ? Math.round(Math.max(scores[x], scores[y]) / sum * 100) : 50;
    });

    return { type, scores, ties, strengths };
  }

  // 기본 24문항 기준으로 이긴 쪽 비율이 기준 미만인 축 (추가 문항 대상)
  function ambiguousAxes() {
    const r = calculateResult();
    return [1, 2, 3, 4].filter(ax => r.strengths['axis' + ax] / 100 < EXTRA_THRESHOLD);
  }

  // 결과 URL용 점수(s): 축마다 두 글자 합이 9가 되도록 비율을 한 자리 숫자로 표현
  // (result.html·deep-analysis.html은 "이긴 쪽 / 합"으로 비율을 계산하므로 형식만 맞으면 된다)
  function encodeScores(result) {
    return AXES.map(([x, y], i) => {
      const a = result.scores[x], b = result.scores[y], sum = a + b;
      let dx = sum ? Math.round(a / sum * 9) : 5;
      if (a === b) dx = result.type[i] === x ? 5 : 4;   // 동점은 정해진 쪽이 5
      return `${dx}${9 - dx}`;
    }).join('');
  }

  // ===== 테스트 완료 =====
  function finishTest() {
    setTimeout(() => {
      // 로딩 화면 표시 + 랜덤 문구
      const loading = document.getElementById('loading');
      const msgEl = document.getElementById('loadingMsg');
      if (msgEl) {
        msgEl.textContent = LOADING_MESSAGES[Math.floor(Math.random() * LOADING_MESSAGES.length)];
      }
      loading.classList.add('show');

      // 결과 계산
      const result = calculateResult();
      track('test_complete', {
        type: result.type,
        ax1: result.strengths.axis1, ax2: result.strengths.axis2,
        ax3: result.strengths.axis3, ax4: result.strengths.axis4,
        extra: extraAxes && extraAxes.length ? extraAxes.join('') : 'none',
        questions: flow.length
      });

      // 확장용 payload (답변 원본 + 메타데이터)
      const payload = {
        result,
        answers,
        completedAt: new Date().toISOString(),
        version: '2.1.0',
        extraAxes: extraAxes || []
      };

      try {
        // lt16_result: 기존 페이지 호환 — result 객체를 그대로 저장 (type 바로 접근 가능)
        sessionStorage.setItem('lt16_result', JSON.stringify(result));
        // lt16_last_result: 확장용 전체 payload (재방문/분석/재검사용)
        localStorage.setItem('lt16_last_result', JSON.stringify(payload));
      } catch (e) {
        /* Storage not available */
      }

      // 점수를 URL로 압축 전달 (공유 가능 + 결과 페이지가 실제 점수 반영)
      const scoreParam = encodeScores(result);

      setTimeout(() => {
        window.location.href = `result.html?type=${result.type}&s=${scoreParam}` + (inviteFrom ? `&with=${inviteFrom}` : '');
      }, 1800);
    }, 400);
  }

  // ===== 초기 렌더링 =====
  // 테스트 시작 시 상태 완전 초기화 (이전 답변/결과가 남지 않도록)
  function startFresh() {
    currentIndex = 0;
    answers = [];
    try {
      sessionStorage.removeItem('lt16_result');
    } catch (e) {}
    renderQuestion();
  }

  startFresh();
  track('test_start');

  // ===== 커플 초대 (?with=유형) — 보낸 사람 유형을 기억해 두고 결과에서 궁합 연결 =====
  const INVITE_TYPES = ['ECRF','ECRA','ECLF','ECLA','ESRF','ESRA','ESLF','ESLA','HCRF','HCRA','HCLF','HCLA','HSRF','HSRA','HSLF','HSLA'];
  let inviteFrom = null;
  (function initInvite() {
    const w = (new URLSearchParams(location.search).get('with') || '').toUpperCase();
    if (INVITE_TYPES.includes(w)) {
      inviteFrom = w;
      try { sessionStorage.setItem('lt16_with', w); } catch (e) {}
      track('invite_open', { from_type: w });
      const banner = document.createElement('div');
      banner.className = 'invite-banner';
      banner.textContent = '💌 궁합 초대를 받았어요! 테스트가 끝나면 보낸 사람과의 궁합이 바로 나와요';
      const main = document.querySelector('main');
      if (main) main.insertBefore(banner, main.firstChild);
    } else {
      try { inviteFrom = sessionStorage.getItem('lt16_with'); } catch (e) {}
      if (!INVITE_TYPES.includes(inviteFrom)) inviteFrom = null;
    }
  })();

  // 뒤로가기 캐시(bfcache)로 복원될 때도 강제 새로고침 처리
  window.addEventListener('pageshow', (e) => {
    if (e.persisted) {
      // 캐시에서 복원된 경우 페이지를 새로 로드해 상태 초기화
      window.location.reload();
    }
  });

  // 키보드 지원 (1~4: 위 문장 / 위쪽 조금 / 아래쪽 조금 / 아래 문장, A·B 키, 왼쪽 화살표)
  document.addEventListener('keydown', (e) => {
    if (document.getElementById('loading').classList.contains('show')) return;
    const KEYS = { '1': 'A2', '2': 'A1', '3': 'B1', '4': 'B2', a: 'A2', A: 'A2', b: 'B2', B: 'B2' };
    if (KEYS[e.key]) selectAnswer(KEYS[e.key]);
    else if (e.key === 'ArrowLeft') goBack();
  });
</script>
